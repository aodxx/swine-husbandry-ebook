name: Build reader prototype

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'content/**'
      - 'data/toc.json'
      - 'data/glossary.json'
      - 'data/sources.json'
      - 'scripts/qa-reader.mjs'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/reader-build.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'content/**'
      - 'data/toc.json'
      - 'data/glossary.json'
      - 'data/sources.json'
      - 'scripts/qa-reader.mjs'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/reader-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reader QA smoke checks
        run: npm run qa:reader
      - name: TypeScript and Vite build
        run: npm run build
