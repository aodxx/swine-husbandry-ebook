<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1132" viewBox="0 0 800 1132">
<rect width="800" height="1132" fill="#f3ead7"/><rect x="28" y="28" width="744" height="1076" rx="8" fill="none" stroke="#7d6546" stroke-width="3"/>
<text x="400" y="170" text-anchor="middle" font-size="46" fill="#243528" font-family="sans-serif">ตำรา นิพนธ์ฟาร์ม</text>
<text x="400" y="222" text-anchor="middle" font-size="27" fill="#4f6746" font-family="sans-serif">ศาสตร์และวิถีการเลี้ยงสุกร</text>
<text x="400" y="268" text-anchor="middle" font-size="19" fill="#765f45" font-family="sans-serif">จากภูมิปัญญาหน้าคอก สู่การจัดการฟาร์มสมัยใหม่</text>
<rect x="90" y="350" width="620" height="430" rx="18" fill="#ded4bc" stroke="#77674f"/>
<text x="400" y="555" text-anchor="middle" font-size="30" fill="#5a654f" font-family="sans-serif">ภาพสุกร / โรงเรือนเชิงสารคดี</text>
<text x="400" y="595" text-anchor="middle" font-size="18" fill="#786d5d" font-family="sans-serif">REFERENCE ONLY — ไม่ใช่ภาพประวัตินิพนธ์ฟาร์ม</text>
<circle cx="150" cy="900" r="74" fill="none" stroke="#4f6746" stroke-width="4"/><text x="150" y="895" text-anchor="middle" font-size="18" fill="#4f6746" font-family="sans-serif">ตำรา</text><text x="150" y="922" text-anchor="middle" font-size="16" fill="#4f6746" font-family="sans-serif">ประจำฟาร์ม</text>
<text x="275" y="865" font-size="22" fill="#304a35" font-family="sans-serif">เข้าใจธรรมชาติของสุกร</text><text x="275" y="910" font-size="22" fill="#304a35" font-family="sans-serif">จัดการฟาร์มอย่างเป็นระบบ</text><text x="275" y="955" font-size="22" fill="#304a35" font-family="sans-serif">ความรู้ที่ใช้ได้จริงและยั่งยืน</text>
</svg>
